; PlatformIO Project Configuration File
;
; HARDWARE PROFILING v6 - migration from tanakamasayuki/TensorFlowLite_ESP32
; to the official Espressif component "esp-tflite-micro" so that the INT8 Conv kernel
; really uses ESP-NN (Xtensa SIMD), not the portable reference kernels.
; Earlier root cause: the kernels/esp_nn/ folder in TensorFlowLite_ESP32 only
; contains only README.md (its .cpp kernels are empty), and conv.cpp in that library
; nol referensi ke ESP_NN -- jadi selalu jatuh ke kernel referensi (lambat).
;
; framework = arduino, espidf -> Serial/Wire/millis/micros can still be used
; and the Arduino libraries (Adafruit INA219), while also adding the
; ESP-IDF component (esp-tflite-micro) through idf_component.yml at the root of this project.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf

; The PlatformIO partition builder (used to generate partitions.bin and the
; checkprogsize limit) does NOT read sdkconfig.defaults -- without this line it falls back
; to the default scheme of the board manifest (factory, 1 MB), although the ESP-IDF build
; itself already points to huge_app.csv (app0, 3 MB) through sdkconfig.defaults.
; Made the same here so that both are consistent.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The partition scheme and flash size are set through sdkconfig.defaults + huge_app.csv
; to the root of this project (required for an ESP-IDF build, not enough through board_build).
upload_speed = 115200

lib_deps =
	adafruit/Adafruit INA219 @ ^1.2.3

build_flags =
	-O3
	-DCORE_DEBUG_LEVEL=0

; Two model variants from the same Float32 weights (see 03_convert_int8.py):
;   pio run -e int8 -t upload   -> full INT8 (int8 activations, ESP-NN)
;   pio run -e 16x8 -t upload   -> 16x8 (int16 activations, int8 weights)
[env:int8]
board = esp32-s3-devkitc-1

[env:16x8]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DMODEL_16X8

; PhaseNet 3-channel (E, N, Z) 16x8 (PhaseNet-pndw seed42): src/main_3ch_16x8.cpp
[env:3ch_16x8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.extra_flags =
	-DBOARD_HAS_PSRAM
build_flags =
	${env.build_flags}
	-DMODEL_3CH_16X8

[env:3ch_int8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.extra_flags =
	-DBOARD_HAS_PSRAM
build_flags =
	${env.build_flags}
	-DMODEL_3CH_16X8
	-DMODEL_3CH_INT8

[env:prof_1ch_int8]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DOP_PROFILE

[env:prof_1ch_16x8]
board = esp32-s3-devkitc-1
build_flags =
	${env.build_flags}
	-DOP_PROFILE -DOP_1CH_16X8

[env:prof_3ch_int8]
